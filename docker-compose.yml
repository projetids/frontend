name: ids-frontend

services:
  frontend:
    build:
      context: .
      target: dev
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    ports:
      - '${DEV_PORT:-5173}:5173'
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
